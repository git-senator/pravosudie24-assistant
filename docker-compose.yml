services:
  assistant:
    build: .
    container_name: tg-assistant
    restart: unless-stopped
    env_file: .env
    command: python -m src.main работать

    volumes:
      # Сессии Telegram и база живут снаружи контейнера,
      # чтобы переживать пересборку
      - ./data:/app/data
      # Скрипт разговора и ключевые слова — тоже снаружи: их правят руками,
      # и после правки должно хватать docker compose restart, без пересборки
      - ./конфиг:/app/конфиг:ro

    # Жёсткие лимиты: больше этого контейнер взять не сможет,
    # что бы внутри ни случилось
    mem_limit: 512m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
